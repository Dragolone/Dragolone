name: Generate xkcd Charts

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/xkcd/**"
      - ".github/workflows/xkcd-charts.yml"

permissions:
  contents: write

concurrency:
  group: xkcd-charts
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fontTools (subsets the embedded font to ~15 KB)
        run: pip install fonttools==4.61.1

      - name: Draw charts
        run: python scripts/xkcd/make_charts.py --out dist
        env:
          # CHARTS_TOKEN is a read-only PAT; without it only public data is charted.
          GH_TOKEN: ${{ secrets.CHARTS_TOKEN || secrets.GITHUB_TOKEN }}
          CHART_USER: ${{ github.repository_owner }}
          CHART_TZ: Asia/Hong_Kong
          REPO_ALIASES: "AI-Smart-Helmet-01WeiChuang=AI Smart Helmet (private)"
          OSS_REPOS: "morluto/rea"

      # The public github-readme-stats instances are paused or gone, so the cards
      # are rendered here and served from the charts branch with the xkcd charts.
      # A failed card never blocks the xkcd charts: yesterday's copy is reused below.
      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&rank_icon=github&bg_color=ffffff&title_color=24292f&text_color=57606a&icon_color=dd4528&ring_color=dd4528
          path: dist/stats.svg
          token: ${{ secrets.CHARTS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
        continue-on-error: true

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&count_private=true&rank_icon=github&bg_color=0d1117&title_color=e6edf3&text_color=8b949e&icon_color=dd4528&ring_color=dd4528
          path: dist/stats-dark.svg
          token: ${{ secrets.CHARTS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
        continue-on-error: true

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=8&hide=html,tex,jupyter%20notebook&bg_color=ffffff&title_color=24292f&text_color=57606a
          path: dist/top-langs.svg
          token: ${{ secrets.CHARTS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
        continue-on-error: true

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=8&hide=html,tex,jupyter%20notebook&bg_color=0d1117&title_color=e6edf3&text_color=8b949e
          path: dist/top-langs-dark.svg
          token: ${{ secrets.CHARTS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
        continue-on-error: true

      - name: Reuse yesterday's card for any that failed
        run: |
          for f in stats stats-dark top-langs top-langs-dark; do
            [ -f "dist/$f.svg" ] || curl -fsSL -o "dist/$f.svg" \
              "https://raw.githubusercontent.com/${{ github.repository }}/charts/$f.svg" || true
          done

      - name: Push charts to charts branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: charts
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
